<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ROAST CAFE | منوی دیجیتال</title>

    <meta
        name="description"
        content="منوی دیجیتال ROAST CAFE"
    >

    <link rel="icon" type="image/png" href="./assets/roast-cafe-logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- =========================
         HEADER / HERO
    ========================== -->
    <header class="hero">

        <div class="hero-decoration hero-decoration-one"></div>
        <div class="hero-decoration hero-decoration-two"></div>

        <div class="hero-content">

            <div class="brand-mark">
                <img
                    class="brand-logo"
                    src="./assets/roast-cafe-logo.png"
                    alt="ROAST CAFE"
                >
            </div>

            <p class="hero-kicker">DIGITAL MENU</p>

            <h1>ROAST CAFE</h1>

            <p class="hero-subtitle">
                طعم خوب، لحظه‌های ماندگار
            </p>

            <div class="hero-actions">

                <button
                    class="btn btn-primary"
                    id="viewMenuButton"
                    type="button"
                >
                    مشاهده منو
                </button>

                <button
                    class="btn btn-secondary"
                    id="searchButton"
                    type="button"
                >
                    جستجوی محصول
                </button>

            </div>

        </div>

    </header>


    <!-- =========================
         MAIN
    ========================== -->
    <main class="main-content">

        <!-- Search -->
        <section class="search-section" id="searchSection">

            <div class="search-box">

                <label for="searchInput">
                    جستجوی محصول
                </label>

                <div class="search-input-wrapper">

                    <input
                        type="search"
                        id="searchInput"
                        placeholder="نام محصول را وارد کنید..."
                        autocomplete="off"
                    >

                    <button
                        id="clearSearchButton"
                        type="button"
                        aria-label="پاک کردن جستجو"
                    >
                        ×
                    </button>

                </div>

            </div>

        </section>


        <!-- Categories -->
        <nav
            class="category-nav"
            id="categoryNav"
            aria-label="دسته‌بندی‌های منو"
        >
        </nav>


        <!-- Menu -->
        <section
            class="menu-section"
            id="menuSection"
        >
        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->
    <footer class="footer">

        <div class="footer-content">

            <img
                src="./assets/roast-cafe-logo.png"
                alt="ROAST CAFE"
                class="footer-logo"
            >

            <h2>ROAST CAFE</h2>

            <p>
                منوی دیجیتال کافه
            </p>

            <div class="footer-info">

                <div class="footer-item">
                    <span>ساعت کاری</span>
                    <strong id="openingHours">
                        ساعت کاری به‌زودی اعلام می‌شود.
                    </strong>
                </div>

                <div class="footer-item">
                    <span>آدرس</span>
                    <strong id="cafeAddress">
                        آدرس کافه به‌زودی اضافه می‌شود.
                    </strong>
                </div>

            </div>

            <div class="footer-bottom">
                © ROAST CAFE
            </div>

        </div>

    </footer>


    <!-- Back to top -->
    <button
        id="backToTop"
        class="back-to-top"
        type="button"
        aria-label="بازگشت به بالا"
    >
        ↑
    </button>


    <script src="./menu.js"></script>

</body>
</html>
